services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ams_extension_backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backend
      DB_USERNAME: backend
      DB_PASSWORD: secret
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - ams_backend

  nginx:
    image: nginx:1.25-alpine
    container_name: ams_extension_backend_nginx
    ports:
      - "8585:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ams_backend

  mysql:
    image: mysql:8.0
    container_name: ams_extension_backend_mysql
    environment:
      MYSQL_DATABASE: backend
      MYSQL_USER: backend
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ams_backend_mysql:/var/lib/mysql
    networks:
      - ams_backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ams_extension_backend_phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8686:80"
    depends_on:
      - mysql
    networks:
      - ams_backend

volumes:
  ams_backend_mysql:

networks:
  ams_backend:
